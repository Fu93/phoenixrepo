# Opt-in mount for the committed snapshot. This file is not named
# docker-compose.override.yml, so Docker Compose will not merge it on its own.
#
# Run this from the Zetaris platform directory, inside WSL. PHOENIX_REAL_DATA
# must be set there to the absolute path of this repo's data/real directory.
# There is no default.
#
#   export PHOENIX_REAL_DATA=/absolute/path/to/phoenixrepo/data/real
#   docker compose -f docker-compose.yml -f /absolute/path/to/phoenixrepo/scripts/zetaris/phoenix-real-data.compose.yml ps
#
# The running service name on the user's install is driver. The driver rejects
# a mount under /opt with "Not allowed to access system file path". The allowed
# root is /home/zetaris/customer-data/shared/. This file therefore mounts the
# snapshot at /home/zetaris/customer-data/shared/phoenix_real, which is also the
# default -ContainerPath in scripts/zetaris/load_real.ps1. This agent did not
# execute the mount.
services:
  driver:
    volumes:
      - ${PHOENIX_REAL_DATA:?PHOENIX_REAL_DATA must be set inside WSL}:/home/zetaris/customer-data/shared/phoenix_real:ro
