# UNVERIFIED from this environment. Do not use this file as PhoenixRepo's own compose file.
# Copy it beside the Zetaris platform compose file. The 2026 install guide uses
# ~/zetaris/zetaris-platform and names the query-engine service `driver`.
#
#   $env:PHOENIX_REAL_DATA = "\\wsl$\Ubuntu\home\<user>\phoenixrepo\data\real"
# or, when compose runs inside WSL:
#   export PHOENIX_REAL_DATA=/mnt/c/Users/<user>/phoenixrepo/data/real
#
# Then: docker compose up -d driver
#
# Alternative, also unverified: older Freemium/Thunderlake images mounted
# ./customer_data at /home/zetaris/data. If the running service is not named
# `driver`, change the service key to that name and the container path to
# /home/zetaris/data/phoenix-real. load_real.ps1 -ContainerPath must match.
services:
  driver:
    volumes:
      - ${PHOENIX_REAL_DATA}:/opt/phoenixrepo/data/real:ro
