name: CI

on:
  push:
    branches:
      - master
    tags-ignore:
    - 'v[0-9]+.[0-9]+.[0-9]+' # these will trigger this w/ workflow_call
    - 'docs-[0-9]+'
  pull_request:
  schedule:
    - cron: '0 14 3 * *' # Monthly at 2pm on the 3rd

  workflow_call:

jobs:
  build:
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        # Node 20 and 22 both pass the suite. Windows is omitted: yarn test:win32
        # has not been verified, and the win32 job below stays gated on windows-latest.
        node-version: [20.x, 22.x]
        os: [ubuntu-latest]
    steps:
    - name: Set git to use LF
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
      if: matrix.os == 'windows-latest'

    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'yarn'
    # Metaverse snapshots normalize paths with /.*hygen\/src/. The repo checkout
    # is /home/runner/work/hygen/hygen, which satisfies that regex.
    - run: yarn install
    - run: yarn build
    - run: yarn hygen:build -- init self

    - run: yarn test
      if: matrix.os == 'ubuntu-latest'
    - run: yarn test:win32
      if: matrix.os == 'windows-latest'
